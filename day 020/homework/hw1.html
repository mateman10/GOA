<!--1. მარტივი ფორმა

შექმენი <form>, რომელშიც იქნება:

label — Name
input — სახელის შესაყვანად
button — Submit-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>Name</label>
        <input>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
