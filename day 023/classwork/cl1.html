<!--1. შექმენი ჩამოსაშლელი მენიუ

შექმენი HTML ფაილი და დაამატე <select> თეგი.
ჩამოსაშლელ მენიუში დაამატე 5 <option>:

- Georgia
- France
- Germany
- Italy
- Spain

მომხმარებელს უნდა შეეძლოს ქვეყნის არჩევა.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="countrys">select country:</label>
        <select>
            <option value="Georgia">Georgia</option>
            <option value="France">France</option>
            <option value="Germany">Germany</option>
            <option value="Italy">Italy</option>
            <option value="Spain">Spain</option>
        </select>
    </form>
</body>
</html>
