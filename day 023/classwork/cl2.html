<!--2. აირჩიე საყვარელი ფერი

შექმენი ჩამოსაშლელი მენიუ, სადაც მომხმარებელი აირჩევს საყვარელ ფერს.

დაამატე შემდეგი option-ები:

- Red
- Blue
- Green
- Yellow
- Black
- White-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="favourite colour">select favourite colour:</label>
        <select>
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
            <option value="Yellow">Yellow</option>
            <option value="Black">Black</option>
            <option value="White">White</option>
        </select>
    </form>
</body>
</html>
