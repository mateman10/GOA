<!--3. აირჩიე ასაკი

შექმენი <select> თეგი, სადაც მომხმარებელს შეეძლება ასაკის არჩევა.

დაამატე option-ები:

- 10
- 11
- 12
- 13
- 14
- 15
- 16
- 17
- 18

ჩამოსაშლელ მენიუში პირველ ვარიანტად დაამატე:

Choose your age

ეს ვარიანტი უნდა იყოს disabled.-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="age">select age:</label>
        <select>
            <option value="Choose your age" disabled>Choose your age</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
        </select>
    </form>
</body>
</html>
