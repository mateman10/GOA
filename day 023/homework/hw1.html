<!--1. შექმენი საყვარელი ხილის ჩამოსაშლელი მენიუ

შექმენი HTML ფაილი და დაამატე <select> თეგი.

ჩამოსაშლელ მენიუში დაამატე 5 <option>:

- Apple
- Banana
- Orange
- Strawberry
- Watermelon

მომხმარებელს უნდა შეეძლოს საყვარელი ხილის არჩევა.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="fav fruit">select favourite fruit:</label>
        <select>
            <option value="Apple">Apple</option>
            <option value="Banana">Banana</option>
            <option value="Orange">Orange</option>
            <option value="Strawberry">Strawberry</option>
            <option value="Watermelon">Watermelon</option>
        </select>
    </form>
</body>
</html>
