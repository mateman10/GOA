<!--9. შექმენი ქულების შესაყვანი Input

შექმენი HTML ფაილი და დაამატე <input>, სადაც მომხმარებელი შეიყვანს გამოცდის ქულას.

დავალება:

- გამოიყენე type="number".
- მიუთითე min="0".
- მიუთითე max="100".
- გამოიყენე required.
- დაამატე label ტექსტით: Enter your score.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="score">enter your score</label>
    <input type="number" min="0" max="100" required>
</body>
</html>
