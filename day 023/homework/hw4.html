<!--4. აირჩიე საყვარელი ფერი

შექმენი HTML ფაილი და დაამატე <select> თეგი.

ჩამოსაშლელ მენიუში დაამატე:

- Red
- Blue
- Green
- Yellow
- Black
- White

პირველ ვარიანტად დაამატე:

Choose your favorite color

ეს ვარიანტი უნდა იყოს disabled.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="favourite colour">favourite colour:</label>
        <select>
            <option value="Choose your favourite colour" disabled>Choose your favourite colour</option>
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
            <option value="Yellow">Yellow</option>
            <option value="Black">Black</option>
            <option value="White">White</option>
        </select>
    </form>
</body>
</html>
