<!--6. შექმენი რიცხვის შესაყვანი Input

შექმენი HTML ფაილი და დაამატე <input>, სადაც მომხმარებელი შეიყვანს რიცხვს.

დავალება:

- გამოიყენე type="number".
- მიუთითე min="10", რათა მომხმარებელმა შეიყვანოს მინიმუმ 10.
- ველი უნდა იყოს აუცილებლად შესავსები required ატრიბუტის გამოყენებით.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <input type="number" required  min="10">
    </form>
</body>
</html>
