<!--1. ჩემი პირველი ვებგვერდი

შექმენი HTML გვერდი თემაზე „ჩემ შესახებ“.

გამოიყენე:

- <h1> — მთავარი სათაური
- <h2> — ქვესათაური
- <p> — მინიმუმ 3 აბზაცი
- <strong> და <b> — მნიშვნელოვანი სიტყვების გამოსაყოფად
- <em> და <i> — ტექსტის დასახრელად
- <hr> — სექციების გასაყოფად

გვერდზე დაწერე:
- შენი სახელი
- შენი ასაკი
- შენი ჰობი
- რატომ მოგწონს პროგრამირება
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემ შესახებ</title>
</head>
<body>
    <h1>ჩემს შესახებ</h1>
    <h2>მათე მანაგაძე</h2>

    <Hr>
    <p>მე ვარ <strong>მანაგაძე მათე</strong></p>
    <p>მე ძირითადად მაქვს 2 ჰობი, <b>ჭადრაკი</b>,<b>რუბიკ კუბიკის აწყობა.</b></p>
    <hr>
    <p>მე ვცხოვრობ <i>იმერეთში, ზესტაფონში.</i></p>
    
</body>
</html>
