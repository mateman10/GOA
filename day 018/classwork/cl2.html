<!--2) შექმენი „ჩემი საყვარელი ნივთების“ გვერდი.
გამოიყენე <h1>, <h2>, <img>, <ul>, <li> და <a>.
დაამატე მინიმუმ 3 სურათი, თითოეულს მიუთითე alt და width.
ასევე დაამატე მინიმუმ 2 ბმული.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>ჩემი საყვარელი ნივთების გვერდი</h1>

    <p>მე მინდა წარმოგიდგინოთ 3 საყვარელი ნივთი</p>

    <ul>
        <li>კუბიკ რუბიკი</li>
        <li>ჭადრაკის დაფა</li>
        <li>ჭადრაკის ფიგურები</li>
    </ul>

    <h2>კუბიკრუბიკი</h2>
    <img src="Screenshot 2026-08-30 190013.png" alt="კუბიკრუბიკი" width="300">

    <h2>ჭადრაკის ფიგურები</h2>
    <img src="Screenshot 2026-08-30 190210.png" alt="ჭადრაკის ფიგურები" width="300">

    <h2>ჭადრაკის დაფა</h2>
    <img src="Screenshot 2026-08-30 190210.png" alt="ჭადრაკის დაფა" width="300">

    <p>
        <a href="https://www.chess.com">chess</a>
    </p>

</body>
</html>
