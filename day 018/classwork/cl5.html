<!--5) შექმენი ერთი დიდი HTML გვერდი თემაზე „ჩემი სამყარო“.
გამოიყენე ამ გაკვეთილზე ნასწავლი რაც შეიძლება ბევრი Tag:
<h1>, <h2>, <h3>, <p>, <a>, <img>, <ul>, <ol>, <li>, <br>, <hr>,
<strong>, <b>, <em>, <i>, <u>, <mark>, <small>, <del>, <sub>, <sup>,
<video>, <audio>.

გვერდზე უნდა იყოს ტექსტი, სურათები, მინიმუმ ერთი ბმული, ერთი სია, ერთი დანომრილი სია, ვიდეო და აუდიო.

გამოიყენე შესაბამისი attributes:
href, src, alt, width, height, target, controls, loop, muted და poster.-->
