<!--1) შექმენი „ჩემი დღის რუტინა“ ვებგვერდი.
გამოიყენე <h1>, <h2>, <p>, <br>, <hr>, <strong>, <em> და <mark>.
აღწერე შენი დღის სხვადასხვა ნაწილი და მნიშვნელოვანი სიტყვები მონიშნე შესაბამისი Tag-ებით.-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ჩემი დღის რუტინა</h1>
    <h2>დილა</h2>
    <p>დილა იწყება <strong>ვარჯიშით,</strong>და გრძელდება <mark>ვარჯიშით.</mark></p>
    <br>
    <h2>შუადღე</h2>
    <p>შუა დღეს, ვარჯიშიდან მოსული ვთამაშობ ჭადრაკს საღამომდე.</p>
    <br>
    <h2>საღამო</h2>
    <p>საღამოს ძირითადად ვთამაშობ <mark>კომპიუტერული თამაშებით.</mark></p>
    
</body>
</html>
